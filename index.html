<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kamana Foods</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #ffffff;
        }

        img {
            display: block;
            width: 100%;
            max-width: 100%;
            height: auto;
            object-fit: contain;
        }

        /* Desktop View */
        @media (min-width: 768px) {
            img {
                max-width: 100%;
            }
        }

        /* Mobile View */
        @media (max-width: 767px) {
            img {
                width: 100%;
                height: auto;
            }
        }
    </style>
</head>

<body>

    <img src="kamanafood.jpg" alt="Kamana Foods Logo">

</body>

</html>
